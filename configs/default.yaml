# ============================================
# Weather Transformer — Default Configuration
# ============================================

# --- Data ---
data:
  # WeatherBench2 ERA5: 6-hourly, 5.625° equiangular grid (64 lon × 32 lat)
  source: "gs://weatherbench2/datasets/era5/1959-2022-6h-64x32_equiangular_conservative.zarr"
  # Model channels, in order: short name → WeatherBench2 variable (+ pressure level in hPa)
  variables:
    t850: {name: "temperature", level: 850}
    z500: {name: "geopotential", level: 500}
    u10: {name: "10m_u_component_of_wind"}
    v10: {name: "10m_v_component_of_wind"}
  # Time range
  train_years: [2015, 2018]   # inclusive
  val_years: [2019, 2019]
  test_years: [2020, 2020]
  # Forecast step (a multiple of the 6-hour data interval)
  lead_time_hours: 6
  # Grid
  lat_size: 32
  lon_size: 64

# --- Model ---
model:
  patch_size: 4
  embed_dim: 256
  num_heads: 8
  num_layers: 6
  mlp_ratio: 4.0      # MLP hidden dim = embed_dim * mlp_ratio
  dropout: 0.1
  in_channels: 4       # number of weather variables
  out_channels: 4

# --- Training ---
training:
  batch_size: 32
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  gradient_clip: 1.0   # max gradient norm
  # Scheduler: cosine annealing from learning_rate down to min_lr
  min_lr: 1.0e-6
  # Checkpointing: best model + every `save_every` epochs
  save_every: 10
  checkpoint_dir: "checkpoints"

# --- Physics Loss ---
loss:
  mse_weight: 1.0
  smoothness_weight: 0.1
  conservation_weight: 0.05

# --- Paths ---
paths:
  data_dir: "data/raw"
  processed_dir: "data/processed"
